name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs the same checks before publishing a tag

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Only superseded pull-request runs; every commit on main and every tag finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint every workflow (expressions, permissions, needs, shellcheck on run blocks)
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color

  commits:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every new commit links a templated issue, is well-formed and keeps docs in sync
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/check_commits.py --self-test
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 scripts/check_commits.py --verify-issues -- "$BEFORE..$AFTER"
          else
            python3 scripts/check_commits.py --verify-issues -- -1 "$AFTER"
          fi

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Consistency and public-repo hygiene (docs, tests, CI, secrets)
        run: python3 scripts/check_consistency.py
      - name: Native prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          cid=$(docker create caddy:2.11.7-alpine)
          docker cp "$cid:/usr/bin/caddy" "$RUNNER_TEMP/fserver-test-caddy"
          docker rm "$cid"
      - name: Go race tests, vet, format and module verification
        env:
          FSERVER_TEST_CADDY_BIN: ${{ runner.temp }}/fserver-test-caddy
        run: |
          go test -race .
          go vet .
          test -z "$(gofmt -l -- *.go)"
          go mod verify
      - name: Script syntax
        run: |
          PYTHONPYCACHEPREFIX="$(mktemp -d)" python3 -m py_compile scripts/*.py tests/*.py

  ui:
    # MCP Apps panels (ui/*.html) driven through a mock host in Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Playwright and Chromium, outside the checkout
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Panel browser tests
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          for test in tests/ui_*.test.mjs; do
            node "$test" || exit 1
          done
          sh -n scripts/exe-dev-up.sh .githooks/commit-msg .githooks/pre-push
      - name: Validate compose files and Caddy configs (proxy and direct)
        env:
          FSERVER_DOMAIN: files.example.com
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.direct.yaml config -q
          for mode in proxy direct; do
            docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" --tmpfs /var/log/agent-fileserver \
              -e FSERVER_DOMAIN -e FSERVER_TRUSTED_PROXIES=172.30.53.1/32 caddy:2.11.7-alpine \
              caddy validate --config "/etc/caddy/Caddyfile.$mode" --adapter caddyfile
          done

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the real compose stack (proxy mode)
        run: |
          sed 's/^FSERVER_DOMAIN=.*/FSERVER_DOMAIN=files.example.com/' .env.example > .env
          docker compose up -d --build --wait
      - name: Container isolation
        run: python3 -B tests/container_sandbox.py
      - name: Static serving, MCP and access logs through Caddy
        run: |
          python3 -B tests/http_acceptance.py
          FSERVER_TEST_LARGE=1 python3 -B tests/mcp_live.py
          python3 -B tests/access_logging.py
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove only this disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
